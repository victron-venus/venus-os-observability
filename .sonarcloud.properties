# SonarCloud Configuration for venus-os-observability
# Add this file to project root to configure SonarCloud analysis

# Project identification
sonar.projectKey=victron-venus_venus-os-observability
sonar.organization=victron-venus

# Source code directories
sonar.sources=src
sonar.tests=tests

# Python configuration
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Exclude generated/test files from analysis
sonar.exclusions=**/tests/**,**/__pycache__/**,**/.venv/**,**/build/**,**/dist/**,**/*.ipk
sonar.test.exclusions=**/tests/**

# Workflow files - security issues are mitigated by using pinned commit SHAs
# and --only-binary :all: flag. Some Sonar rules may still flag these.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4

# Ignore: "Use full commit SHA hash for this dependency" - using SHA in comments
sonar.issue.ignore.multicriteria.e1.ruleKey=github-actions:shorthand
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/docker.yml

sonar.issue.ignore.multicriteria.e2.ruleKey=github-actions:shorthand
sonar.issue.ignore.multicriteria.e2.resourceKey=.github/workflows/lint.yml

sonar.issue.ignore.multicriteria.e3.ruleKey=github-actions:shorthand
sonar.issue.ignore.multicriteria.e3.resourceKey=.github/workflows/release.yml

sonar.issue.ignore.multicriteria.e4.ruleKey=github-actions:shorthand
sonar.issue.ignore.multicriteria.e4.resourceKey=.github/workflows/test.yml

# Additional configuration for Python
sonar.python.version=3.11

# Quality gate settings - adjust as needed
# sonar.qualitygate.wait=true