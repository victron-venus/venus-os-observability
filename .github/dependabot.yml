version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      # Keep CodeQL components and shared workflow pins in one reviewed update.
      ci-workflows:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    # Keep the Ubuntu 24.04/Python 3.12 native ABI; digest and patch updates remain enabled.
    ignore:
      - dependency-name: ubuntu
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: docker
    directory: /alert-mqtt-bridge
    schedule:
      interval: daily

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
