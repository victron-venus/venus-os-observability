name: Docker

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: ghcr.io/victron-venus/venus-os-observability:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and smoke test the alert bridge image
        run: |
          docker build --tag venus-alert-bridge:ci alert-mqtt-bridge
          docker run --rm -i --network none --entrypoint python venus-alert-bridge:ci - <<'PY'
          import sys
          from importlib.metadata import version
          import paho.mqtt.client as mqtt
          import relay
          from cryptography import x509

          assert sys.version_info[:2] == (3, 15)
          assert version("paho-mqtt") == "2.1.0"
          assert relay.client.callback_api_version == mqtt.CallbackAPIVersion.VERSION1
          relay.client.on_connect(relay.client, None, {}, 0)
          assert relay._connect_event.is_set()
          relay.client.on_disconnect(relay.client, None, 0)
          assert not relay._connect_event.is_set()
          relay.client.on_connect(relay.client, None, {}, 3)
          assert not relay._connect_event.is_set()
          relay.verified_context()
          print("Python 3.15, Paho callbacks and TLS dependencies verified offline")
          PY
    timeout-minutes: 30
