version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    # Keep the Ubuntu 24.04/Python 3.12 native ABI; digest and patch updates remain enabled.
    ignore:
      - dependency-name: ubuntu
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: docker
    directory: /alert-mqtt-bridge
    schedule:
      interval: daily

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
  # Renovate owns CI updates. The ignore rule also prevents separate
  # Dependabot security-update PRs; vulnerability alerts remain enabled.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
