[project]
name = "venus-os-observability"
version = "0.1.0"
description = "OpenTelemetry/Prometheus observability for Venus OS - D-Bus event tracing, inverter metrics, distributed tracing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-api>=1.28,<1.29",
    "opentelemetry-sdk>=1.28,<1.29",
    "opentelemetry-exporter-prometheus>=0.57b0,<0.60",
    "opentelemetry-exporter-otlp>=1.28,<1.29",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28,<1.29",
    "opentelemetry-instrumentation>=0.49b0,<0.50",
    "prometheus-client>=0.19",
    "paho-mqtt>=2.0",
    "dbus-next>=0.2",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
tempo = [
    "opentelemetry-exporter-otlp-proto-grpc>=1.28,<1.29",
]
all = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28,<1.29",
]

[project.urls]
Homepage = "https://github.com/victron-venus/venus-os-observability"
Repository = "https://github.com/victron-venus/venus-os-observability"
Issues = "https://github.com/victron-venus/venus-os-observability/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["venus_observability*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --strict-markers --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["S101", "B008"]
per-file-ignores = { "tests/*" = ["S101", "B011"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
strict = true

[tool.coverage.run]
source = ["src/venus_observability"]
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError"]
show_missing = true