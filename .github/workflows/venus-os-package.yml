name: Venus OS Source Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/venus-os-package.yml'
      - 'scripts/validate_setuphelper_archive.py'
      - 'tests/test_setuphelper_archive.py'
      - 'src/**'
      - 'services/**'
      - 'version'
      - 'setup'
      - 'update.sh'
      - 'gitHubInfo'
      - 'pyproject.toml'
      - 'setup.py'
      - 'config.example.yaml'
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  source-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build and validate SetupHelper source archive
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          version=$(cat version)
          if [ -n "$RELEASE_TAG" ]; then
            test "$RELEASE_TAG" = "v$version"
          fi
          mkdir -p dist
          archive="dist/venus-os-observability-$version-setuphelper.tar.gz"
          git archive --format=tar.gz --prefix=venus-os-observability/ \
            --output="$archive" HEAD -- \
            src services version setup update.sh gitHubInfo pyproject.toml \
            setup.py config.example.yaml README.md LICENSE
          python scripts/validate_setuphelper_archive.py "$archive"
          (cd dist && sha256sum "${archive#dist/}" > SHA256SUMS)
      - name: Upload source artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: venus-os-observability-setuphelper
          path: |
            dist/*-setuphelper.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Attach source package to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77 # v1
        with:
          files: |
            dist/*-setuphelper.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
